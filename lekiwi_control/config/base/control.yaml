controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    statistics_publish_rate: 0.0  # Disable /controller_manager/statistics/* topics

    # Command and error handling
    enforce_command_limits: true  # Enforce URDF joint limits via JointSaturationLimiter
    handle_exceptions: true       # Graceful error handling
    
    # Hardware component initialization
    defaults:
      switch_controller:
        strictness: strict
      allow_controller_activation_with_inactive_hardware: false
      deactivate_controllers_on_hardware_self_deactivate: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    base_controller:
      type: omni_wheel_drive_controller/OmniWheelDriveController

base_controller:
  ros__parameters:
    # 3 wheels at 60°/180°/300° from +X
    wheel_offset: 1.0471975511965976  # rad (π/3)
    wheel_names:
      - left_wheel_joint
      - back_wheel_joint
      - right_wheel_joint

    robot_radius: 0.132239  # m
    wheel_radius: 0.051     # m

    odom_frame_id: odom
    base_frame_id: base_footprint

    enable_odom_tf: false     # EKF publishes odom TF instead
    open_loop: false
    position_feedback: false

    cmd_vel_timeout: 0.5  # s

    # 3-DoF safe limits - must stay in sync with nav2.yaml/control.launch.py.
    linear:
      x:
        max_velocity: 0.2      # m/s
        max_acceleration: 1.0  # m/s^2
      y:
        max_velocity: 0.17      # m/s
        max_acceleration: 0.85  # m/s^2
    angular:
      z:
        max_velocity: 0.68     # rad/s
        max_acceleration: 3.4  # rad/s^2

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: bno055  # must match the URDF ros2_control block's <sensor name="...">
    frame_id: imu_frame

    # Static covariance (row-major 3x3, diagonal) - derived from the BNO055 datasheet's noise
    # specs at 100 Hz.
    static_covariance_orientation: [0.001, 0.0,   0.0,
                                     0.0,  0.001,  0.0,
                                     0.0,  0.0,   0.001]

    static_covariance_angular_velocity: [1.0e-5, 0.0,    0.0,
                                          0.0,   1.0e-5,  0.0,
                                          0.0,   0.0,    1.0e-5]

    static_covariance_linear_acceleration: [2.0e-4, 0.0,    0.0,
                                             0.0,   2.0e-4,  0.0,
                                             0.0,   0.0,    2.0e-4]

    # Residual angular mounting offset on top of the URDF's axis_remap - not currently needed.
    # rotation_offset:
    #   roll:  0.0  # rad
    #   pitch: 0.0  # rad
    #   yaw:   0.0  # rad