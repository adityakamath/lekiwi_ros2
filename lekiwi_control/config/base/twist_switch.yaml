twist_switch:
  ros__parameters:
    # Default input: joy_teleop publishes TwistStamped on /cmd_vel_teleop
    input_topic_default: /cmd_vel_teleop
    input_topic_default.stamped: true

    # Switched input: Nav2 velocity_smoother publishes TwistStamped on /cmd_vel_smoothed.
    input_topic_switched: /cmd_vel_smoothed
    input_topic_switched.stamped: true

    # Output feeds collision_monitor (cmd_vel_in_topic in nav2.yaml), downstream of this
    # switch rather than upstream, so it protects teleop too, not just Nav2 goals.
    output_topic: /cmd_vel_presafety
    output_topic.stamped: true

    frame_id: base_link
