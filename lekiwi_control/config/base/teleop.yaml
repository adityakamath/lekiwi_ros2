joy_teleop:
  ros__parameters:
    teleop:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: /cmd_vel_teleop
      deadman_buttons: [9] # L1
      axis_mappings:
        twist-linear-x:
          axis: 1 # Left stick vertical
          scale: 0.2
          offset: 0.0
        twist-linear-y:
          axis: 0 # Left stick horizontal
          scale: 0.17
          offset: 0.0
        twist-angular-z:
          axis: 2 # Right stick horizontal
          scale: 0.68
          offset: 0.0
        header-frame_id:
          value: 'base_link'

    # Fires bool_toggle_node's Trigger services below.
    estop_toggle:
      type: service
      interface_type: std_srvs/srv/Trigger
      service_name: /emergency_stop_toggle
      buttons: [1]  # B

    twist_switch_toggle:
      type: service
      interface_type: std_srvs/srv/Trigger
      service_name: /twist_switch_toggle
      buttons: [2]  # X

    # waypoint_recorder_node's services.
    record_waypoint:
      type: service
      interface_type: std_srvs/srv/SetBool
      service_name: /record_waypoint
      service_request:
        data: true
      buttons: [3]  # Y

    waypoint_follow_toggle:
      type: service
      interface_type: std_srvs/srv/Trigger
      service_name: /waypoint_follow_toggle
      buttons: [0]  # A

    reset_waypoints:
      type: service
      interface_type: std_srvs/srv/SetBool
      service_name: /reset_waypoints
      service_request:
        data: true
      buttons: [11]  # settings

    # map_saver_node's service.
    save_map:
      type: service
      interface_type: std_srvs/srv/SetBool
      service_name: /save_map
      service_request:
        data: true
      buttons: [4]  # screenshot

# bool_toggle_node also reads this file (see control.launch.py).
bool_toggle_node:
  ros__parameters:
    toggles: ["emergency_stop", "twist_switch", "waypoint_follow"]

    emergency_stop:
      trigger_service: /emergency_stop_toggle
      target_service: /emergency_stop
      initial_state: false

    twist_switch:
      trigger_service: /twist_switch_toggle
      target_service: /twist_switch
      initial_state: false

    waypoint_follow:
      trigger_service: /waypoint_follow_toggle
      target_service: /waypoint_follow
      initial_state: false
