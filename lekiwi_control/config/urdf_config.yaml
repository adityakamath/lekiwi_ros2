serial_port: /dev/ttySERVO
baud_rate: 1000000

use_mock: false
use_sync_write: true

left_motor_id: 7
back_motor_id: 8
right_motor_id: 9

sts3215_max_vel_steps: 3400
proportional_acc_max: 25
# Bus-level: scales the speed of all position joints (the pan-tilt payload's) so they arrive together.
# 0 = each joint uses its commanded velocity. Only used when a payload with position joints is mounted.
proportional_vel_max: 0

internal_max_vel: 254
internal_max_acc: 254
internal_acc_coeff: 100
internal_control_period: 10