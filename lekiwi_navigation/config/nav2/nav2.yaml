# Nav2 navigation stack — loaded by nav2.launch.py.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_name_prefixes:
      - backup
      - compute_path
      - follow_path
      - nav_to_pose
      - spin
      - wait

controller_server:
  ros__parameters:
    controller_frequency: 10.0       # Hz
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    speed_limit_topic: "speed_limit"  # must match local_costmap speed_filter plugin
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 28
      model_dt: 0.1
      batch_size: 1250             # reduced from 2000 for Pi5
      vx_max: 0.2                  # m/s — must match base_controller (control.yaml)
      vx_min: -0.2
      vy_max: 0.17                 # m/s — omni, must match base_controller
      vy_min: -0.17
      wz_max: 0.68                 # rad/s — must match base_controller
      wz_min: -0.68
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      ax_max: 1.0                  # m/s² — must match base_controller
      ax_min: -1.0
      ay_max: 0.85                 # m/s²
      ay_min: -0.85
      az_max: 3.4                  # rad/s²
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"         # holonomic — robot can move in any direction
      visualize: false             # saves CPU
      regenerate_noises: true
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.5
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false   # costmap uses robot_radius, no polygon footprint
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2   # evaluate every 2nd point; Nav2 default, better collision accuracy
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 15
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0                    # FORWARD
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0           # Nav2 default; allows strafing while preferring forward motion
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0       # matches controller_frequency for tighter obstacle response
      publish_frequency: 1.0       # 1 Hz saves Zenoh bandwidth on Pi5
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6                     # m
      height: 6                    # m
      resolution: 0.05
      robot_radius: 0.17           # m — wheel contact radius + safety margin
      plugins: ["obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter", "speed_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: false
        filter_info_topic: "keepout_costmap_filter_info"
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: false
        filter_info_topic: "speed_costmap_filter_info"
        speed_limit_topic: "speed_limit"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.20
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.17
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: false
        filter_info_topic: "keepout_costmap_filter_info"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      always_send_full_costmap: false

keepout_costmap_filter_info_server:
  ros__parameters:
    type: 0                        # keepout
    filter_info_topic: "keepout_costmap_filter_info"
    mask_topic: "keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

speed_costmap_filter_info_server:
  ros__parameters:
    type: 1                        # speed limit, percentage of max speed
    filter_info_topic: "speed_costmap_filter_info"
    mask_topic: "speed_filter_mask"
    base: 100.0                    # speed_limit = mask_value * multiplier + base
    multiplier: -1.0

# Note: planner_server logs one spurious ERROR at startup:
#   "Inflation layer either not found or inflation is not set sufficiently..."
# This is a Nav2 Kilted bug: GridCollisionChecker's constructor always passes
# possible_collision_cost=-1 to setFootprint(), which unconditionally triggers
# the check. For a circular robot (robot_radius), possible_collision_cost is
# never consulted during actual collision checking — no performance impact.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0  # Hz
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25              # m
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0       # s
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false  # omni — any arrival heading is fine
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

waypoint_follower:
  ros__parameters:
    loop_rate: 10                  # Hz, matches controller_frequency
    stop_on_failure: true
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0   # ms

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0          # Hz
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      acceleration_limit: 1.0      # must match base_controller ax_max (control.yaml)
      deceleration_limit: -1.0     # must match base_controller ax_min (control.yaml)
      minimum_speed: 0.10
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.68       # must match base_controller wz_max (control.yaml)
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.4        # must match base_controller az_max (control.yaml)

# Reads cmd_vel_raw (MPPI output) and rate-limits it before it reaches collision_monitor.
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0      # Hz
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.17, 0.68]    # [vx, vy, wz] — must match base_controller
    min_velocity: [-0.2, -0.17, -0.68]
    max_accel: [1.0, 0.85, 3.4]
    max_decel: [-1.0, -0.85, -3.4]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Downstream of twist_switch_node — protects both teleop and Nav2 goals.
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_presafety"
    cmd_vel_out_topic: "base_controller/cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.1
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 0.8   # s
      simulation_time_step: 0.1
      min_points: 10
      visualize: true
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
