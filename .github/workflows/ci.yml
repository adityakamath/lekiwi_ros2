name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .

  test:
    name: pytest (ros:${{ matrix.ros_distro }})
    # rclpy and the ROS message packages the test suite needs aren't on PyPI, so this
    # runs inside a ROS image instead of alongside the pip-only lint job above.
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [kilted, jazzy]
    runs-on: ubuntu-latest
    container: ros:${{ matrix.ros_distro }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: src/lekiwi_ros2

      - name: Install ROS dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            python3-pip python3-pil python3-yaml git \
            ros-${{ matrix.ros_distro }}-ament-index-python \
            ros-${{ matrix.ros_distro }}-controller-manager \
            ros-${{ matrix.ros_distro }}-diagnostic-aggregator \
            ros-${{ matrix.ros_distro }}-forward-command-controller \
            ros-${{ matrix.ros_distro }}-generate-parameter-library \
            ros-${{ matrix.ros_distro }}-imu-sensor-broadcaster \
            ros-${{ matrix.ros_distro }}-joint-state-broadcaster \
            ros-${{ matrix.ros_distro }}-joy-teleop \
            ros-${{ matrix.ros_distro }}-nav2-bringup \
            ros-${{ matrix.ros_distro }}-navigation2 \
            ros-${{ matrix.ros_distro }}-omni-wheel-drive-controller \
            ros-${{ matrix.ros_distro }}-robot-localization \
            ros-${{ matrix.ros_distro }}-robot-state-publisher \
            ros-${{ matrix.ros_distro }}-ros2-control \
            ros-${{ matrix.ros_distro }}-ros2-controllers \
            ros-${{ matrix.ros_distro }}-slam-toolbox \
            ros-${{ matrix.ros_distro }}-teleop-twist-joy \
            ros-${{ matrix.ros_distro }}-teleop-twist-keyboard \
            ros-${{ matrix.ros_distro }}-xacro
          pip install --break-system-packages --ignore-installed -r src/lekiwi_ros2/requirements-dev.txt
          # test_render_phrases.py imports lekiwi_audio.tts to monkeypatch Synthesizer, which
          # imports onnxruntime/kokoro_onnx/soundfile at module level even though the tests
          # themselves stub out the actual model - so these still need to be installed here.
          pip install --break-system-packages --ignore-installed -r src/lekiwi_ros2/lekiwi_audio/requirements-build.txt

      - name: colcon build
        # --packages-ignore is required, not optional cleanup: lekiwi_bringup/lekiwi_control's
        # package.xml declare pt_control/pt_bringup/ldlidar_ros2/sts_hardware_interface/
        # bno055_hardware_interface/ina260_ros2 as dependencies, and colcon discovers them on
        # disk via their submodules even with --packages-select - then fails trying to source
        # their (never-built) install output unless explicitly ignored. Each has its own CI already.
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon build --packages-select \
            lekiwi_control lekiwi_navigation lekiwi_description lekiwi_bringup lekiwi_audio \
            pt_description \
            --packages-ignore pt_control pt_bringup \
              sts_hardware_interface bno055_hardware_interface ldlidar_ros2 ina260_ros2

      - name: pytest
        # lekiwi_bringup's own test (test_launch_args.py) is excluded: it launches the full
        # default payload stack end-to-end, which pulls in pt_bringup - and pt_bringup needs
        # cloudini, point_cloud_interfaces, and depthai-ros, none of which are plain apt
        # packages here. Everything else is self-contained and needs only the packages above.
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          . install/setup.sh
          pytest \
            src/lekiwi_ros2/lekiwi_control/test \
            src/lekiwi_ros2/lekiwi_navigation/test \
            src/lekiwi_ros2/lekiwi_description/test \
            src/lekiwi_ros2/lekiwi_audio/test
