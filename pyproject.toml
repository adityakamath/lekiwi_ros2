[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
# E, F, W only - deliberately not "I" (import sorting). ament_flake8's bundled
# flake8-import-order plugin is the existing convention for every package here
# (declared as a test_depend, run via `colcon test`/local ament_flake8), and its
# ordering rules don't match ruff's isort-style output. Running both would mean
# every commit fights itself. ament_flake8 stays the source of truth for import
# order; ruff covers everything else quickly, without a ROS environment.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length - not enforced here; several pre-existing lines already exceed it
]

[tool.basedpyright]
# Scoped to lekiwi_control for now, not the whole repo - the highest-value package to
# start on since it talks directly to motion/mode-switching topics and services. Other
# packages are follow-up work, added incrementally the same way.
include = ["lekiwi_control/lekiwi_control"]
pythonVersion = "3.12"
# basedpyright's own default rules are stricter than upstream pyright's (reportAny,
# reportUnannotatedClassAttribute, ...) and fire constantly against rclpy's
# Parameter.value and generated message classes, which are inherently loosely typed at
# the library boundary. "standard" matches pyright's own default and keeps the 0-errors
# gate meaningful instead of noisy.
typeCheckingMode = "standard"
