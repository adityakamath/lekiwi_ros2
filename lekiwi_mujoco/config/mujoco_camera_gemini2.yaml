# Gemini 2 render camera for the no-payload base (same as pt_mujoco's); depth goes to a private topic for the host to register to color.
/**:
  ros__parameters:
    mujoco_plugins:
      mujoco_camera_plugin:
        gemini2_rgb:
          frame_name: gemini2_color_optical_frame
          info_topic: /gemini2/color/camera_info
          image_topic: /gemini2/color/image_raw
          depth_topic: /_gemini2/depth_raw
