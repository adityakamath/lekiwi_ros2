# Plugins loaded by mujoco_ros2_control's ros2_control_node (control.launch.py, hardware type
# mujoco). Camera config is in mujoco_camera_pantilt.yaml, loaded only for payload:=pantilt.
/**:
  ros__parameters:
    mujoco_plugins:
      mujoco_3d_lidar_plugin:
        type: "mujoco_ros2_control_plugins/Mujoco3dLidarPlugin"
        # Keyed by the MJCF sensor name (build_mujoco_models --lidar plugin). Raw scan: the
        # plugin reports "no hit" as -1, so laser_filters turns it into /scan (see
        # mujoco_laser_filter*.yaml), the same raw-to-filtered split the real LD06 uses.
        lidar:
          frame_name: laser_frame
          topic: /scan_raw
      # Ground-truth base pose/velocity (no controller drift).
      free_joint_state_publisher:
        type: "mujoco_ros2_control_plugins/FreeJointStatePublisherPlugin"
        frame_id: ""
        publish_rate: 30.0
      # /emergency_stop for the simulation (the real one is served by sts_hardware_interface):
      # stops the wheels and holds the pan-tilt while enabled. Package: modules/estop_mujoco_plugin.
      emergency_stop_plugin:
        type: "estop_mujoco_plugin/EmergencyStopPlugin"
      # Push a body for a test (service apply_wrench): shove the robot to try Nav2's recoveries.
      external_wrench_plugin:
        type: "mujoco_ros2_control_plugins/ExternalWrenchPlugin"
