# Phrase table for the audio indicator node.
#
# services: <service name>.<request "true"|"false">.<"success"|"failure"> -> spoken text
# nav_goal: <"success"|"failure"> -> spoken text (ad-hoc /navigate_to_pose outcomes only)
#
# A missing entry means "don't announce anything". A missing "failure" entry falls back to a
# generic "Error" in code.

services:
  /emergency_stop:
    "true":
      success: "Emergency stop enabled"
    "false":
      success: "Emergency stop disabled"

  /twist_switch:
    "true":
      success: "Autonomous mode"
    "false":
      success: "Tele-op mode"

  /record_waypoint:
    "true":
      success: "Waypoint recorded"
      failure: "Error"

  /reset_waypoints:
    "true":
      success: "Waypoints reset"

  /waypoint_follow:
    "true":
      success: "Waypoint following enabled"
      failure: "No waypoints found"
    "false":
      success: "Waypoint following disabled"

  /save_map:
    "true":
      success: "Saving map"
      failure: "Error"

  # Published by ina260_ros2's battery_events_node, which fires each of these once per
  # hysteresis-debounced edge - see that node's module docstring. /battery_low, /battery_critical
  # and /battery_full are each genuinely two-sided SetBool services (they also fire "false" once
  # recovered/reset), but no "false" phrase is configured here - a missing entry means "don't
  # announce anything" (see the top of this file), which is exactly the once-per-falling/rising-
  # edge behavior wanted; a recovery phrase can be added later without any code changes.
  /battery_charging:
    "true":
      success: "Charging"
    "false":
      success: "Discharging"

  /battery_low:
    "true":
      success: "Battery low"

  /battery_critical:
    "true":
      success: "Battery critical"

  /battery_full:
    "true":
      success: "Battery full"

nav_goal:
  success: "Goal reached"
  failure: "Goal failed"
