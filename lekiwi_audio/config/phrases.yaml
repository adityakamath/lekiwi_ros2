services:
  /emergency_stop:
    "true":
      success: "Emergency stop enabled"
    "false":
      success: "Emergency stop disabled"

  /twist_switch:
    "true":
      success: "Autonomous mode"
    "false":
      success: "Tele-op mode"

  /record_waypoint:
    "true":
      success: "Waypoint recorded"
      failure: "Error"

  /reset_waypoints:
    "true":
      success: "Waypoints reset"

  /waypoint_follow:
    "true":
      success: "Waypoint following enabled"
      failure: "No waypoints found"
    "false":
      success: "Waypoint following disabled"

  /save_map:
    "true":
      success: "Saving map"
      failure: "Error"

  # No "false" phrase - once-per-edge announcements only.
  /battery_low:
    "true":
      success: "Battery low"

  /battery_critical:
    "true":
      success: "Battery critical"

  /battery_full:
    "true":
      success: "Battery full"

goal_status:
  nav_goal:
    success: "Goal reached"
    failure: "Goal failed"
    canceled: "Goal canceled"
